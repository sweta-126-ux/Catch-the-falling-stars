<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101426">
  <title>Catch the Falling Stars</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header>
      <h1>⭐ Catch the Falling Stars</h1>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
    </header>

<p id="status">Move with ← → or A/D. Catch the stars!</p>
<div id="arena" aria-label="Game area">
<div id="player" aria-label="Player">🧺</div>
</div>
<button id="start">Start Game</button>
  </main>
</body>
</html>
</CodeBlock>
